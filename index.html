<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<div class="box">Hello GSAP!</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
  gsap.registerPlugin(ScrollTrigger);
</script>
<div class="box">Scroll to Animate Me!</div>
<script>
  gsap.to(".box", {
    x: 300, 
    rotation: 360,
    duration: 2,
    scrollTrigger: {
      trigger: ".box",      // element that triggers the animation
      start: "top 80%",     // when the top of .box hits 80% of viewport
      end: "top 30%",       // when it reaches 30% of viewport
      scrub: true,          // smooth scrubbing as you scroll
      markers: true         // shows start/end markers (for testing)
    }
  });
</script>

<script>
  gsap.to(".box", {
    x: 200,        // move 200px to the right
    rotation: 360, // spin in a full circle
    duration: 2,   // animation lasts 2 seconds
    ease: "power2.inOut"
  });
</script>
